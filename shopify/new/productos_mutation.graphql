mutation {
  p0: productUpdate(product: {id: "gid://shopify/Product/15394571845947", descriptionHtml: "<p>Cojín lumbar con correa ajustable. Se fija a tu silla y acompaña la curva de la espalda baja durante las horas sentado.</p><p><strong>Ideal si</strong></p><ul><li>Pasas muchas horas sentado.</li><li>Terminas el día con la espalda baja cargada.</li></ul><p>También viene en el <a href=\"/products/kit-setup-correcto\">Kit Setup Correcto</a>, junto al reposapiés.</p>", metafields: [{namespace: "custom", key: "bajada", type: "single_line_text_field", value: "Apoyo para la espalda baja en tu silla de trabajo."}]}) { product { handle } userErrors { field message } }
  p1: productUpdate(product: {id: "gid://shopify/Product/15394572501307", descriptionHtml: "<p>Reposapiés con inclinación ajustable. Te permite apoyar bien los pies y bajar la tensión en piernas y espalda baja en jornadas largas.</p><p><strong>Ideal si</strong></p><ul><li>Tus pies no llegan cómodos al suelo.</li><li>Pasas jornadas largas sentado.</li></ul><p>También viene en el <a href=\"/products/kit-setup-correcto\">Kit Setup Correcto</a>, junto al soporte lumbar.</p>", metafields: [{namespace: "custom", key: "bajada", type: "single_line_text_field", value: "Pies bien apoyados mientras trabajas sentado."}]}) { product { handle } userErrors { field message } }
  p2: productUpdate(product: {id: "gid://shopify/Product/15394572566843", descriptionHtml: "<p>Brazo articulado que eleva el notebook a la altura de los ojos. Dejas de mirar hacia abajo y liberas espacio en el escritorio.</p><p><strong>Ideal si</strong></p><ul><li>Trabajas con notebook varias horas al día.</li><li>Terminas la jornada con el cuello tenso.</li></ul><p>También viene en el <a href=\"/products/kit-escritorio-completo\">Kit Escritorio Completo</a>.</p>", metafields: [{namespace: "custom", key: "bajada", type: "single_line_text_field", value: "Sube el notebook a la altura de tus ojos."}]}) { product { handle } userErrors { field message } }
  p3: productUpdate(product: {id: "gid://shopify/Product/15394572599611", descriptionHtml: "<p>Cojín de memory foam con corte anatómico. Reparte el peso y reduce la presión sobre coxis y glúteos al estar sentado.</p><p><strong>Ideal si</strong></p><ul><li>Tu silla se vuelve incómoda después de unas horas.</li><li>Sientes molestia en el coxis al estar sentado.</li></ul><p>Como todo memory foam, pierde firmeza con el uso. Conviene renovarlo con el tiempo.</p><p>También viene en el <a href=\"/products/kit-escritorio-completo\">Kit Escritorio Completo</a>.</p>", metafields: [{namespace: "custom", key: "bajada", type: "single_line_text_field", value: "Asiento más cómodo en jornadas largas."}]}) { product { handle } userErrors { field message } }
  p4: productUpdate(product: {id: "gid://shopify/Product/15394572632379", descriptionHtml: "<p>Lámpara LED de escritorio con temperatura de color regulable. Sin parpadeo ni deslumbramiento.</p><p><strong>Ideal si</strong></p><ul><li>Pasas muchas horas frente a la pantalla.</li><li>La luz de tu escritorio te cansa la vista.</li></ul>", metafields: [{namespace: "custom", key: "bajada", type: "single_line_text_field", value: "Luz regulable para trabajar sin cansar la vista."}]}) { product { handle } userErrors { field message } }
  p5: productUpdate(product: {id: "gid://shopify/Product/15394572697915", descriptionHtml: "<p>Sistema para ordenar cables más una mini regleta de escritorio. Tu setup queda limpio y sin enredos.</p><p><strong>Ideal si</strong></p><ul><li>Tienes cables a la vista en el escritorio.</li><li>Necesitas enchufes más cerca.</li></ul><p>También viene en el <a href=\"/products/kit-escritorio-completo\">Kit Escritorio Completo</a>.</p>", metafields: [{namespace: "custom", key: "bajada", type: "single_line_text_field", value: "Cables ordenados y enchufes a mano."}]}) { product { handle } userErrors { field message } }
  p6: productUpdate(product: {id: "gid://shopify/Product/15394572730683", descriptionHtml: "<p>Banda ajustable que te recuerda mantener los hombros en una postura neutra durante el día.</p><p><strong>Ideal si</strong></p><ul><li>Te encorvas frente al computador sin darte cuenta.</li><li>Buscas una primera solución simple.</li></ul><p>La guía de uso te explica cuándo conviene usar un corrector y cuándo no.</p><p>También viene en el <a href=\"/products/kit-postura-movilidad\">Kit Postura + Movilidad</a>.</p>", metafields: [{namespace: "custom", key: "bajada", type: "single_line_text_field", value: "Un recordatorio para mantener los hombros en su lugar."}]}) { product { handle } userErrors { field message } }
  p7: productUpdate(product: {id: "gid://shopify/Product/15394573418811", descriptionHtml: "<p>Pistola de masaje de percusión para después de entrenar. No es solo el aparato: incluye un protocolo de uso por deporte, avalado por kinesiólogo, que te dice cómo y cuándo usarla.</p><p><strong>Ideal si</strong></p><ul><li>Entrenas varias veces por semana.</li><li>Quieres una rutina de recuperación con instrucciones claras.</li></ul><p>Es el único producto con motor de nuestro catálogo, por eso pasa por un control de calidad reforzado.</p>", metafields: [{namespace: "custom", key: "bajada", type: "single_line_text_field", value: "Masaje de percusión con protocolo de uso por deporte."}]}) { product { handle } userErrors { field message } }
  p8: productUpdate(product: {id: "gid://shopify/Product/15394574139707", descriptionHtml: "<p>Rodillo de espuma con superficie texturizada para liberación miofascial (automasaje) antes o después de entrenar.</p><p><strong>Ideal si</strong></p><ul><li>Entrenas seguido y terminas con los músculos cargados.</li><li>Quieres algo simple para usar a diario.</li></ul><p>También viene en el <a href=\"/products/kit-recuperacion-post-entreno\">Kit Recuperación Post-Entreno</a>.</p>", metafields: [{namespace: "custom", key: "bajada", type: "single_line_text_field", value: "Automasaje antes o después de entrenar."}]}) { product { handle } userErrors { field message } }
  p9: productUpdate(product: {id: "gid://shopify/Product/15394574762299", descriptionHtml: "<p>Set de bandas elásticas de distintas resistencias para movilidad, activación y trabajo de piernas.</p><p><strong>Ideal si</strong></p><ul><li>Quieres activar el cuerpo antes de entrenar.</li><li>Buscas ejercicios de movilidad en casa.</li></ul><p>También viene en el <a href=\"/products/kit-recuperacion-post-entreno\">Kit Recuperación Post-Entreno</a>.</p>", metafields: [{namespace: "custom", key: "bajada", type: "single_line_text_field", value: "Bandas de distinta resistencia para movilidad y activación."}]}) { product { handle } userErrors { field message } }
  p10: productUpdate(product: {id: "gid://shopify/Product/15394575515963", descriptionHtml: "<p>Bola doble tipo “peanut” para liberar tensión en cuello, espalda y glúteos, con una precisión que un rodillo no logra.</p><p><strong>Ideal si</strong></p><ul><li>Tienes tensión en puntos específicos.</li><li>Quieres algo pequeño para usar en casa o llevar al gimnasio.</li></ul>", metafields: [{namespace: "custom", key: "bajada", type: "single_line_text_field", value: "Automasaje preciso en cuello, espalda y glúteos."}]}) { product { handle } userErrors { field message } }
  p11: productUpdate(product: {id: "gid://shopify/Product/15394576138555", descriptionHtml: "<p>Manga de compresión textil para piernas, pensada para la recuperación después de entrenar.</p><p><strong>Ideal si</strong></p><ul><li>Entrenas piernas con frecuencia.</li><li>Quieres sumar compresión a tu rutina de recuperación.</li></ul>", metafields: [{namespace: "custom", key: "bajada", type: "single_line_text_field", value: "Compresión para piernas después de entrenar."}]}) { product { handle } userErrors { field message } }
  p12: productUpdate(product: {id: "gid://shopify/Product/15394576367931", descriptionHtml: "<p>Correa de estiramiento con una guía impresa de posiciones. Te ayuda a estirar bien, sin necesidad de un instructor.</p><p><strong>Ideal si</strong></p><ul><li>Pasas muchas horas sentado y te sientes rígido.</li><li>Quieres una rutina corta de movilidad en casa.</li></ul><p>También viene en el <a href=\"/products/kit-postura-movilidad\">Kit Postura + Movilidad</a>.</p>", metafields: [{namespace: "custom", key: "bajada", type: "single_line_text_field", value: "Estiramientos guiados, con posiciones impresas."}]}) { product { handle } userErrors { field message } }
  p13: productUpdate(product: {id: "gid://shopify/Product/15394576400699", descriptionHtml: "<p>Spray de magnesio para aplicar sobre la piel después de entrenar. Es de uso externo: no se ingiere.</p><p><strong>Ideal si</strong></p><ul><li>Ya tienes una rutina de recuperación y quieres complementarla.</li></ul><p>También viene en el <a href=\"/products/kit-recuperacion-post-entreno\">Kit Recuperación Post-Entreno</a>.</p>", metafields: [{namespace: "custom", key: "bajada", type: "single_line_text_field", value: "Magnesio de uso tópico para después de entrenar."}]}) { product { handle } userErrors { field message } }
  p14: productUpdate(product: {id: "gid://shopify/Product/15394576433467", descriptionHtml: "<p>Las dos piezas base para trabajar sentado con buena postura, más una guía impresa para medir y ajustar tu puesto desde el primer día.</p><p><strong>Incluye</strong></p><ul><li><a href=\"/products/soporte-lumbar-ajustable\">Soporte Lumbar Ajustable</a></li><li><a href=\"/products/reposapies-ergonomico-inclinable\">Reposapiés Ergonómico Inclinable</a></li><li>Guía de medición impresa</li></ul><p><strong>Ideal si</strong></p><ul><li>Trabajas sentado muchas horas.</li><li>No sabes por dónde empezar. Es nuestra recomendación base.</li></ul>", metafields: [{namespace: "custom", key: "bajada", type: "single_line_text_field", value: "Soporte lumbar + reposapiés: la base de un escritorio cómodo."}]}) { product { handle } userErrors { field message } }
  p15: productUpdate(product: {id: "gid://shopify/Product/15394591965499", descriptionHtml: "<p>Tres piezas que cambian cómo se siente trabajar sentado: pantalla a la altura de los ojos, un asiento que reparte el peso y cables en orden.</p><p><strong>Incluye</strong></p><ul><li><a href=\"/products/soporte-para-laptop-con-brazo-ajustable\">Soporte para Laptop con Brazo Ajustable</a></li><li><a href=\"/products/cojin-de-asiento-anatomico\">Cojín de Asiento Anatómico</a></li><li><a href=\"/products/organizador-de-cables-mini-regleta\">Organizador de Cables + Mini Regleta</a></li></ul><p><strong>Ideal si</strong></p><ul><li>Estás armando tu escritorio de teletrabajo.</li><li>Trabajas con notebook.</li></ul>", metafields: [{namespace: "custom", key: "bajada", type: "single_line_text_field", value: "Pantalla a la altura correcta, asiento cómodo y escritorio ordenado."}]}) { product { handle } userErrors { field message } }
  p16: productUpdate(product: {id: "gid://shopify/Product/15394592096571", descriptionHtml: "<p>Una rutina de recuperación completa: automasaje y movilidad con el rodillo y las bandas, y magnesio tópico para cerrar el día.</p><p><strong>Incluye</strong></p><ul><li><a href=\"/products/rodillo-de-espuma-texturizado\">Rodillo de Espuma Texturizado</a></li><li><a href=\"/products/set-de-bandas-de-resistencia-y-movilidad\">Set de Bandas de Resistencia y Movilidad</a></li><li><a href=\"/products/spray-de-magnesio-topico-post-entreno\">Spray de Magnesio Tópico</a></li></ul><p><strong>Ideal si</strong></p><ul><li>Entrenas con regularidad.</li><li>Quieres recuperarte mejor entre sesiones, no solo estirar.</li></ul>", metafields: [{namespace: "custom", key: "bajada", type: "single_line_text_field", value: "Rodillo, bandas y magnesio: tu rutina post-entreno completa."}]}) { product { handle } userErrors { field message } }
  p17: productUpdate(product: {id: "gid://shopify/Product/15394592227643", descriptionHtml: "<p>Trabaja la postura desde dos frentes: un recordatorio durante el día y movilidad guiada para compensar las horas sentado.</p><p><strong>Incluye</strong></p><ul><li><a href=\"/products/corrector-de-postura-ajustable\">Corrector de Postura Ajustable</a></li><li><a href=\"/products/cinta-de-estiramiento-con-guia-de-posiciones\">Cinta de Estiramiento con Guía de Posiciones</a></li></ul><p><strong>Ideal si</strong></p><ul><li>Pasas muchas horas sentado.</li><li>Ya resolviste tu escritorio y quieres trabajar el cuerpo.</li></ul>", metafields: [{namespace: "custom", key: "bajada", type: "single_line_text_field", value: "Corrector de postura + cinta de estiramiento guiada."}]}) { product { handle } userErrors { field message } }
